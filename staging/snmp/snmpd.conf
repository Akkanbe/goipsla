# snmpd for the P7 staging checks (staging/compose.snmp.yaml).
# SNMP on udp/161, and the AgentX master on tcp/705 for goipslad, which runs
# in the source container (10.100.1.10) and connects to tcp:10.100.1.20:705.
agentAddress udp:161
master agentx
agentXSocket tcp:0.0.0.0:705
agentXTimeout 5
agentXRetries 1
rocommunity public default
sysLocation ipsla staging
sysContact goipsla staging
